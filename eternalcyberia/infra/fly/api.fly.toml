app = "ec-api"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.service"
  [build.args]
    PKG = "@ec/api"

[env]
  API_PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "10s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
