app = "ec-realtime"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.service"
  [build.args]
    PKG = "@ec/realtime"

[env]
  REALTIME_PORT = "4001"
  NODE_ENV = "production"

# Rooms are memory-resident, so machines must never auto-stop under a live
# session. Redis pub/sub (docs/adr/0004) means a peer landing on a different
# machine still converges — sticky routing is an optimisation, not a requirement.
[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 600

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
