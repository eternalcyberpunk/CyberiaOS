app = "ec-worker"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.service"
  [build.args]
    PKG = "@ec/worker"

[env]
  NODE_ENV = "production"

# No http_service: the worker pulls from Redis, nothing routes to it.
# Scale on queue depth: fly scale count worker=N
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
