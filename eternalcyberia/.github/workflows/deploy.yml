name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # apps/web deploys itself through the Vercel git integration.
  # This job only ships the three long-lived services.
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { app: ec-api,      pkg: "@ec/api",      config: infra/fly/api.fly.toml }
          - { app: ec-realtime, pkg: "@ec/realtime", config: infra/fly/realtime.fly.toml }
          - { app: ec-worker,   pkg: "@ec/worker",   config: infra/fly/worker.fly.toml }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy ${{ matrix.service.app }}
        run: >
          flyctl deploy --remote-only
          --config ${{ matrix.service.config }}
          --app ${{ matrix.service.app }}
          --build-arg PKG=${{ matrix.service.pkg }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Expand-only migrations run after the API is live so a rollback never
  # needs a schema rollback (see docs/adr and §12 of the design doc).
  migrate:
    needs: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ec/schema exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
