name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ec, POSTGRES_PASSWORD: ec, POSTGRES_DB: ec }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ec" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://ec:ec@localhost:5432/ec
      REDIS_QUEUE_URL: redis://localhost:6379/0
      REDIS_PUBSUB_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budgets
        run: pnpm budget            # fails when a studio exceeds manifest.budgetKb
      - name: E2E (mobile + desktop)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }
