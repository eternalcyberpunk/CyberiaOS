name: Extract Archive (TAR/ZIP)

on:
  workflow_dispatch:
  push:
    paths:
      - '*.tar'
      - '*.tar.gz'
      - '*.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract archives
        run: |
          # Extract .tar.gz files
          for archive in *.tar.gz; do
            if [ -f "$archive" ]; then
              echo "Extracting $archive..."
              tar -xzf "$archive" 2>/dev/null || echo "Skipping invalid .tar.gz: $archive"
            fi
          done
          
          # Extract .tar files (skip if invalid)
          for archive in *.tar; do
            if [ -f "$archive" ]; then
              echo "Extracting $archive..."
              tar -xf "$archive" 2>/dev/null || echo "Skipping invalid .tar: $archive"
            fi
          done
          
          # Extract .zip files
          for archive in *.zip; do
            if [ -f "$archive" ]; then
              echo "Extracting $archive..."
              unzip -q "$archive" 2>/dev/null || echo "Skipping invalid .zip: $archive"
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push extracted files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "Extract archive contents"
          git push
